<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ _('Personalized Lifestyle Plan') }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script>
    // Apply dark mode before page renders to prevent flash
    (function() {
      var savedTheme = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
 <style>
    /* 1. Prevent Overlap: Space for Fixed Navbar */
    body {
        padding-top: 120px !important; 
        overflow-x: hidden;
        font-family: 'Inter', sans-serif;
    }

    /* 2. Cyber-Terminal Input Style */
    .input-terminal {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom: 2px solid rgba(59, 130, 246, 0.3);
        color: inherit;
        transition: all 0.3s ease;
    }

    .input-terminal:focus {
        border-color: #00d2ff;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
        outline: none;
    }

    /* 3. High-Contrast Generate Button */
    .glow-btn {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* 4. Fix Navbar Layering */
    .nav-floating {
        z-index: 9999 !important;
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
    }
</style>
</head>

<body class="bg-gradient-to-br from-blue-100 to-purple-100 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 min-h-screen flex flex-col transition-colors duration-300">

  {% include 'navbar.html' %}

  <main class="flex-grow flex items-center justify-center p-6">
    <section class="premium-glass max-w-4xl w-full p-8 md:p-12 space-y-10 shadow-2xl">
        <header class="text-center">
            <h2 class="text-4xl font-black tracking-tighter text-slate-800 dark:text-white uppercase mb-2">
                🌿 {{ _('Lifestyle Diagnostics') }}
            </h2>
            <p class="text-blue-600 dark:text-blue-400 font-bold tracking-widest text-[10px] uppercase opacity-70">
                {{ _('Neural Health Protocol Generator') }}
            </p>
        </header>

        <form id="planForm" class="grid md:grid-cols-2 gap-6">
            <div class="space-y-2">
                <label class="block text-[10px] font-black text-slate-700 dark:text-blue-400 uppercase tracking-widest ml-2">{{ _('Age') }}</label>
                <input type="number" id="age" name="age" class="input-terminal w-full rounded-2xl px-6 py-4" required />
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] font-black text-slate-700 dark:text-blue-400 uppercase tracking-widest ml-2">{{ _('Weight (kg)') }}</label>
                <input type="number" id="weight" name="weight" step="0.1" class="input-terminal w-full rounded-2xl px-6 py-4" required />
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] font-black text-slate-700 dark:text-blue-400 uppercase tracking-widest ml-2">{{ _('Height (cm)') }}</label>
                <input type="number" id="height" name="height" step="0.1" class="input-terminal w-full rounded-2xl px-6 py-4" required />
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] font-black text-slate-700 dark:text-blue-400 uppercase tracking-widest ml-2">{{ _('BMI') }}</label>
                <input type="number" id="bmi" name="bmi" step="0.1" class="input-terminal w-full rounded-2xl px-6 py-4" required />
            </div>

            <div class="space-y-2 md:col-span-2">
                <label class="block text-[10px] font-black text-slate-700 dark:text-blue-400 uppercase tracking-widest ml-2">{{ _('Activity Level') }}</label>
                <select id="activity" name="activity" class="input-terminal w-full rounded-2xl px-6 py-4 appearance-none" required>
                    <option value="" disabled selected>{{ _('Select activity level') }}</option>
                    <option value="low">{{ _('Low (Sedentary)') }}</option>
                    <option value="moderate">{{ _('Moderate (3-5 days/week)') }}</option>
                    <option value="high">{{ _('High (Daily or intense exercise)') }}</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="glow-btn md:col-span-2 w-full text-white py-5 rounded-2xl shadow-2xl flex justify-center items-center gap-4 text-xl">
                <span id="btnText">🔍 {{ _('Execute Neural Scan') }}</span>
                <span id="btnSpinner" class="loading-spinner hidden"></span>
            </button>
        </form>

        <div id="result" class="mt-8 hidden fade-in" role="status" aria-live="polite"></div>
    </section>
</main>

  <script>
    const form = document.getElementById('planForm');
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    
    const weightInput = document.getElementById('weight');
    const heightInput = document.getElementById('height');
    const bmiInput = document.getElementById('bmi');

    function calculateBMI() {
      const weight = parseFloat(weightInput.value);
      const heightCm = parseFloat(heightInput.value);

      if (weight > 0 && heightCm > 0) {
        const heightM = heightCm / 100;
        const bmi = weight / (heightM * heightM);
        bmiInput.value = bmi.toFixed(1);
      } else {
        bmiInput.value = '';
      }
    }

    weightInput.addEventListener('input', calculateBMI);
    heightInput.addEventListener('input', calculateBMI);

    const GENERATE_TEXT = btnText.textContent;
    const GENERATING_TEXT = `⏳ {{ _('Generating...') }}`;

    const categoryIcons = {
      diet: '🍽️',
      exercise: '🏃',
      stress: '🧘',
      sleep: '😴',
      monitoring: '📊'
    };
    const categoryTitles = {
      diet: 'Diet & Nutrition', exercise: 'Exercise & Activity', stress: 'Stress Management', sleep: 'Sleep & Recovery', monitoring: 'Health Monitoring'
    };

    function setLoading(loading) {
      submitBtn.disabled = loading;
      btnText.textContent = loading ? GENERATING_TEXT : GENERATE_TEXT;
      btnSpinner.classList.toggle('hidden', !loading);
      submitBtn.classList.toggle('opacity-75', loading);
    }

    function showResultMessage(message, variant = 'info') {
      const variantClasses = {
        info: 'bg-blue-50 border-blue-200 text-blue-800',
        error: 'bg-red-50 border-red-200 text-red-700',
      };
      const classes = variantClasses[variant] || variantClasses.info;

      resultDiv.innerHTML = `
        <div class="p-4 border rounded-xl ${classes}">
          ${message}
        </div>
      `;
      resultDiv.classList.remove('hidden');
      resultDiv.classList.add('show');
    }

    function renderPlan(data) {
      if (!data || data.success !== true || !data.plan || typeof data.plan !== 'object' || !data.profile) {
        showResultMessage(`{{ _('No lifestyle plan data was returned. Please try again.') }}`, 'error');
        return;
      }

      const { plan, profile, source } = data;
      let profileHtml = `
        <div class="mb-6 p-4 bg-blue-50 rounded-xl border border-blue-200">
          <h3 class="text-lg font-semibold text-blue-800 mb-2">{{ _('Your Profile') }}</h3>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
            <div><span class="text-gray-600">{{ _('Age') }}:</span> <strong>${profile.age}</strong> (${profile.age_group})</div>
            <div><span class="text-gray-600">{{ _('BMI') }}:</span> <strong>${profile.bmi}</strong> (${profile.bmi_category})</div>
            <div><span class="text-gray-600">{{ _('Activity') }}:</span> <strong class="capitalize">${profile.activity}</strong></div>
          </div>
        </div>
      `;

      let planHtml = '<h3 class="text-2xl font-semibold mb-4 text-blue-700">{{ _("Your Custom Lifestyle Plan") }}</h3>';
      planHtml += '<div class="grid gap-4">';

      let renderedAny = false;
      for (const [category, tips] of Object.entries(plan)) {
        if (tips && tips.length > 0) {
          renderedAny = true;
          planHtml += `
            <div class="category-card p-4 bg-white/80 rounded-xl border border-gray-200 shadow-sm">
              <div class="flex items-center gap-2 mb-3">
                <span class="text-2xl">${categoryIcons[category] || '📌'}</span>
                <h4 class="font-semibold text-gray-800">${categoryTitles[category] || category}</h4>
              </div>
              <ul class="space-y-2">
                ${tips.map(tip => `<li class="flex items-start gap-2 text-gray-700"><span class="text-green-500 mt-1">*</span><span>${tip}</span></li>`).join('')}
              </ul>
            </div>
          `;
        }
      }
      planHtml += '</div>';

      if (!renderedAny) {
        showResultMessage(`{{ _('A plan was generated but it contained no recommendations. Please try again.') }}`, 'error');
        return;
      }

      if (source === 'ai') planHtml += '<p class="text-xs text-gray-500 mt-4 text-center">✨ Personalized with AI</p>';

      resultDiv.innerHTML = profileHtml + planHtml;
      resultDiv.classList.remove('hidden');
      resultDiv.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Reset output area for a clean run
      resultDiv.classList.add('hidden');
      resultDiv.classList.remove('show');
      resultDiv.innerHTML = '';
      
      // Secondary check: Ensure BMI was actually calculated
      if (!bmiInput.value) {
        alert("{{ _('Please enter valid weight and height (or fill BMI) to continue.') }}");
        return;
      }

      setLoading(true);

      const formData = { age: form.age.value, bmi: form.bmi.value, activity: form.activity.value };

      try {
        const response = await fetch('/api/lifestyle-plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Failed to generate plan');

        renderPlan(data);
      } catch (error) {
        console.error('Error:', error);
        showResultMessage(`<strong>Error:</strong> ${error.message}`, 'error');
      } finally {
        setLoading(false);
      }
    });

    // Language selector (guarded: navbar may vary per page)
    const langBtn = document.getElementById('lang-btn');
    const langDropdown = document.getElementById('lang-dropdown');
    if (langBtn && langDropdown) {
      langBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        langDropdown.classList.toggle('show');
      });
      document.addEventListener('click', function() {
        langDropdown.classList.remove('show');
      });
    }
    function setLanguage(langCode) {
      fetch('/api/set-language', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language: langCode })
      })
      .then(response => response.json())
      .then(data => { if (data.success) window.location.reload(); })
      .catch(err => console.error('Language switch failed:', err));
    }
    function toggleTheme() {
    // 1. Toggle the dark class
    const isDark = document.documentElement.classList.toggle('dark');
    
    // 2. Update the navbar icon
    const icon = document.getElementById('theme-icon');
    if (icon) {
        // Change moon to sun and vice-versa
        if (isDark) {
            icon.classList.replace('fa-moon', 'fa-sun');
            icon.style.color = '#facc15'; // Yellow for sun
        } else {
            icon.classList.replace('fa-sun', 'fa-moon');
            icon.style.color = '#3b82f6'; // Blue for moon
        }
    }
    
    // 3. Save to localStorage
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
  </script>
</body>

</html>
